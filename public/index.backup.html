<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>B2B Wholesale Pricing Fast</title>

<style>
:root{
 --bg:#f6f7f8;
 --surface:#fff;
 --surface2:#f1f3f4;
 --border:#e1e4e8;
 --text:#202223;
 --muted:#6d7175;
 --primary:#008060;
 --primary2:#006e52;
 --green-bg:#e4f4ec;
 --green:#137333;
 --danger:#d72c0d;
 --danger-bg:#fce8e6;
 --shadow:0 1px 3px rgba(0,0,0,.06);
}

[data-theme="dark"]{
 --bg:#101312;
 --surface:#171b19;
 --surface2:#202522;
 --border:#303633;
 --text:#f1f3f2;
 --muted:#a7aeaa;
 --primary:#36b98a;
 --primary2:#2da77c;
 --green-bg:#17372c;
 --green:#6ee7b7;
 --danger:#ff8a75;
 --danger-bg:#40201b;
 --shadow:0 2px 8px rgba(0,0,0,.25);
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,select{font:inherit}

.header{
 height:64px;
 background:var(--surface);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 position:sticky;
 top:0;
 z-index:50;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
}

.logo{
 width:35px;
 height:35px;
 border-radius:9px;
 background:var(--primary);
 color:#fff;
 display:grid;
 place-items:center;
 font-weight:800;
}

.brand-name{
 font-size:15px;
 font-weight:750;
}

.brand-name span{color:var(--primary)}

.header-right{
 display:flex;
 align-items:center;
 gap:7px;
}

.icon{
 width:38px;
 height:38px;
 border:0;
 background:transparent;
 color:var(--text);
 border-radius:8px;
 cursor:pointer;
}

.icon:hover{background:var(--surface2)}

.store{
 display:flex;
 align-items:center;
 gap:8px;
 padding:4px 7px;
 border:1px solid var(--border);
 background:var(--surface);
 color:var(--text);
 border-radius:9px;
}

.avatar{
 width:30px;
 height:30px;
 border-radius:8px;
 background:var(--primary);
 color:#fff;
 display:grid;
 place-items:center;
 font-size:12px;
 font-weight:700;
}

.layout{
 display:flex;
 min-height:calc(100vh - 64px);
}

.sidebar{
 width:238px;
 position:fixed;
 top:64px;
 bottom:0;
 background:var(--surface);
 border-right:1px solid var(--border);
 padding:16px 12px;
}

.section-title{
 color:var(--muted);
 font-size:10px;
 font-weight:800;
 letter-spacing:.08em;
 text-transform:uppercase;
 padding:13px 10px 7px;
}

.nav{
 width:100%;
 border:0;
 background:transparent;
 color:var(--muted);
 padding:10px 11px;
 display:flex;
 align-items:center;
 gap:10px;
 border-radius:8px;
 cursor:pointer;
 text-align:left;
 font-size:13px;
 margin-bottom:2px;
}

.nav:hover{
 background:var(--surface2);
 color:var(--text);
}

.nav.active{
 background:var(--green-bg);
 color:var(--primary);
 font-weight:700;
}

.nav-icon{
 width:18px;
 text-align:center;
}

.main{
 margin-left:238px;
 width:100%;
 padding:28px;
}

.container{
 max-width:1250px;
 margin:auto;
}

.page-top{
 display:flex;
 justify-content:space-between;
 align-items:flex-end;
 gap:20px;
 margin-bottom:24px;
}

.eyebrow{
 color:var(--primary);
 font-size:10px;
 font-weight:800;
 text-transform:uppercase;
 letter-spacing:.08em;
 margin-bottom:7px;
}

h1{
 margin:0;
 font-size:28px;
 letter-spacing:-.5px;
}

.subtitle{
 margin-top:7px;
 color:var(--muted);
 font-size:13px;
}

.actions{
 display:flex;
 gap:8px;
}

.btn{
 border:1px solid var(--border);
 background:var(--surface);
 color:var(--text);
 padding:10px 14px;
 border-radius:8px;
 cursor:pointer;
 font-size:13px;
 font-weight:650;
}

.btn:hover{background:var(--surface2)}

.btn-primary{
 background:var(--primary);
 border-color:var(--primary);
 color:#fff;
}

.btn-primary:hover{background:var(--primary2)}

.panel{
 background:var(--surface);
 border:1px solid var(--border);
 border-radius:11px;
 box-shadow:var(--shadow);
 overflow:hidden;
}

.toolbar{
 padding:14px;
 border-bottom:1px solid var(--border);
 display:flex;
 gap:10px;
 align-items:center;
 justify-content:space-between;
}

.search{
 flex:1;
 max-width:390px;
 position:relative;
}

.search input{
 width:100%;
 padding:10px 12px 10px 36px;
 border:1px solid var(--border);
 border-radius:8px;
 background:var(--surface);
 color:var(--text);
 outline:none;
}

.search span{
 position:absolute;
 left:12px;
 top:9px;
 color:var(--muted);
}

.filters{
 display:flex;
 gap:7px;
}

.filter{
 border:1px solid var(--border);
 background:var(--surface);
 color:var(--muted);
 padding:9px 12px;
 border-radius:8px;
 cursor:pointer;
 font-size:12px;
}

.filter.active{
 background:var(--green-bg);
 color:var(--primary);
 border-color:transparent;
 font-weight:700;
}

.rule-list{
 width:100%;
}

.rule-row{
 display:flex;
 align-items:center;
 gap:14px;
 padding:16px;
 border-bottom:1px solid var(--border);
}

.rule-row:last-child{border-bottom:0}

.rule-main{
 flex:1;
 min-width:0;
}

.rule-title{
 font-size:14px;
 font-weight:750;
 margin-bottom:5px;
}

.rule-meta{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 color:var(--muted);
 font-size:11px;
}

.meta{
 padding:4px 7px;
 border-radius:5px;
 background:var(--surface2);
}

.status{
 padding:5px 9px;
 border-radius:20px;
 font-size:10px;
 font-weight:750;
}

.status.active{
 color:var(--green);
 background:var(--green-bg);
}

.status.paused{
 color:var(--muted);
 background:var(--surface2);
}

.rule-actions{
 display:flex;
 gap:5px;
}

.small-btn{
 width:34px;
 height:34px;
 border:1px solid var(--border);
 border-radius:7px;
 background:var(--surface);
 color:var(--text);
 cursor:pointer;
}

.small-btn:hover{background:var(--surface2)}

.empty{
 padding:60px 20px;
 text-align:center;
 color:var(--muted);
}

.empty-icon{
 width:50px;
 height:50px;
 margin:auto auto 12px;
 border-radius:12px;
 background:var(--green-bg);
 color:var(--primary);
 display:grid;
 place-items:center;
 font-size:22px;
}

.overlay{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.48);
 display:none;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:100;
}

.modal{
 width:100%;
 max-width:620px;
 max-height:92vh;
 overflow:auto;
 background:var(--surface);
 border:1px solid var(--border);
 border-radius:13px;
 box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.modal-head{
 padding:18px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid var(--border);
}

.modal-title{
 font-size:17px;
 font-weight:750;
}

.modal-body{padding:20px}

.field{margin-bottom:16px}

.field label{
 display:block;
 font-size:12px;
 font-weight:700;
 margin-bottom:7px;
}

.field input,
.field select{
 width:100%;
 padding:11px;
 border:1px solid var(--border);
 border-radius:8px;
 background:var(--surface);
 color:var(--text);
 outline:none;
}

.field input:focus,
.field select:focus{
 border-color:var(--primary);
}

.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.tier-title{
 font-size:12px;
 font-weight:750;
 margin-bottom:8px;
}

.tier-head,
.tier{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:8px;
}

.tier-head{
 color:var(--muted);
 font-size:10px;
 margin-bottom:6px;
}

.tier{
 margin-bottom:8px;
}

.tier input{
 width:100%;
}

.add-tier{
 width:100%;
 border:1px dashed var(--border);
 background:transparent;
 color:var(--primary);
 padding:9px;
 border-radius:8px;
 cursor:pointer;
}

.modal-footer{
 padding:14px 18px;
 border-top:1px solid var(--border);
 display:flex;
 justify-content:flex-end;
 gap:8px;
}

.mobile-nav{display:none}

@media(max-width:800px){

 .sidebar{display:none}

 .main{
  margin-left:0;
  padding:22px 15px 80px;
 }

 .page-top{
  flex-direction:column;
  align-items:flex-start;
 }

 .actions{
  width:100%;
 }

 .actions .btn-primary{width:100%}

 .toolbar{
  flex-direction:column;
  align-items:stretch;
 }

 .search{
  max-width:none;
 }

 .filters{
  overflow:auto;
 }

 .rule-row{
  align-items:flex-start;
 }

 .rule-actions{
  flex-direction:column;
 }

 .mobile-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:64px;
  display:flex;
  justify-content:space-around;
  background:var(--surface);
  border-top:1px solid var(--border);
  z-index:60;
 }

 .mobile-item{
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:9px;
 }

 .mobile-item.active{
  color:var(--primary);
  font-weight:700;
 }

}

@media(max-width:500px){

 .brand-name{
  font-size:12px;
 }

 .store span{
  display:none;
 }

 h1{font-size:25px}

 .grid2{
  grid-template-columns:1fr;
 }

 .rule-row{
  gap:10px;
 }

 .status{
  display:none;
 }

}
</style>
</head>

<body>

<header class="header">

 <div class="brand">
  <div class="logo">BF</div>
  <div class="brand-name">
   B2B Wholesale Pricing <span>Fast</span>
  </div>
 </div>

 <div class="header-right">

  <button class="icon" onclick="toggleTheme()" id="theme">
   ☾
  </button>

  <button class="icon">🔔</button>

  <button class="store">
   <span>My Store</span>
   <div class="avatar">M</div>
  </button>

 </div>

</header>

<div class="layout">

<aside class="sidebar">

 <div class="section-title">Overview</div>

 <button class="nav" onclick="dashboard()">
  <span class="nav-icon">⌂</span>
  Dashboard
 </button>

 <div class="section-title">Commerce</div>

 <button class="nav active">
  <span class="nav-icon">◇</span>
  Pricing Rules
 </button>

 <button class="nav">
  <span class="nav-icon">♙</span>
  Customer Groups
 </button>

 <button class="nav">
  <span class="nav-icon">▣</span>
  Products
 </button>

 <button class="nav">
  <span class="nav-icon">▤</span>
  Price Lists
 </button>

 <div class="section-title">Insights</div>

 <button class="nav">
  <span class="nav-icon">◒</span>
  Analytics
 </button>

 <div class="section-title">System</div>

 <button class="nav">
  <span class="nav-icon">⚙</span>
  Settings
 </button>

</aside>

<main class="main">

<div class="container">

<div class="page-top">

 <div>
  <div class="eyebrow">Commerce</div>
  <h1>Pricing Rules</h1>
  <div class="subtitle">
   Control how wholesale prices are calculated for your customers.
  </div>
 </div>

 <div class="actions">
  <button class="btn">Import CSV</button>
  <button class="btn btn-primary" onclick="openCreate()">
   + Create rule
  </button>
 </div>

</div>

<div class="panel">

 <div class="toolbar">

  <div class="search">
   <span>⌕</span>
   <input
    id="search"
    placeholder="Search pricing rules..."
    oninput="renderRules()">
  </div>

  <div class="filters">

   <button
    class="filter active"
    onclick="setFilter('all',this)">
    All
   </button>

   <button
    class="filter"
    onclick="setFilter('active',this)">
    Active
   </button>

   <button
    class="filter"
    onclick="setFilter('paused',this)">
    Paused
   </button>

  </div>

 </div>

 <div id="rules" class="rule-list"></div>

</div>

</div>

</main>

</div>

<nav class="mobile-nav">

 <button class="mobile-item">
  <span>⌂</span>
  Home
 </button>

 <button class="mobile-item active">
  <span>◇</span>
  Pricing
 </button>

 <button class="mobile-item" onclick="openCreate()">
  <span>＋</span>
  Create
 </button>

 <button class="mobile-item">
  <span>♙</span>
  Customers
 </button>

 <button class="mobile-item">
  <span>⚙</span>
  Settings
 </button>

</nav>

<div class="overlay" id="overlay">

<div class="modal">

 <div class="modal-head">

  <div class="modal-title" id="modalTitle">
   Create pricing rule
  </div>

  <button class="icon" onclick="closeModal()">✕</button>

 </div>

 <div class="modal-body">

  <div class="field">
   <label>Rule name</label>
   <input
    id="name"
    placeholder="Example: Wholesale Tier 1">
  </div>

  <div class="grid2">

   <div class="field">
    <label>Customer group</label>
    <select id="group">
     <option>Wholesale</option>
     <option>VIP Distributor</option>
     <option>Enterprise</option>
     <option>Retail</option>
    </select>
   </div>

   <div class="field">
    <label>Discount type</label>
    <select id="type">
     <option>Percentage</option>
     <option>Fixed price</option>
    </select>
   </div>

  </div>

  <div class="grid2">

   <div class="field">
    <label>Minimum order quantity</label>
    <input id="moq" type="number" placeholder="50">
   </div>

   <div class="field">
    <label>Applies to</label>
    <select id="products">
     <option>All products</option>
     <option>Selected products</option>
     <option>Selected collections</option>
    </select>
   </div>

  </div>

  <div class="field">

   <div class="tier-title">
    Quantity pricing tiers
   </div>

   <div class="tier-head">
    <span>Minimum</span>
    <span>Maximum</span>
    <span>Discount</span>
   </div>

   <div id="tiers">

    <div class="tier">
     <input placeholder="1">
     <input placeholder="49">
     <input placeholder="0%">
    </div>

    <div class="tier">
     <input placeholder="50">
     <input placeholder="199">
     <input placeholder="15%">
    </div>

    <div class="tier">
     <input placeholder="200">
     <input placeholder="499">
     <input placeholder="30%">
    </div>

   </div>

   <button class="add-tier" onclick="addTier()">
    + Add pricing tier
   </button>

  </div>

 </div>

 <div class="modal-footer">

  <button class="btn" onclick="closeModal()">
   Cancel
  </button>

  <button class="btn btn-primary" onclick="saveRule()">
   Save rule
  </button>

 </div>

</div>

</div>

<script>

let filter="all";
let editingId=null;

const defaultRules=[
 {
  id:1,
  name:"Wholesale Tier 1",
  group:"Wholesale",
  moq:50,
  products:"All products",
  tiers:"50–199 units · 15% discount",
  active:true
 },
 {
  id:2,
  name:"Wholesale Tier 2",
  group:"Wholesale",
  moq:200,
  products:"All products",
  tiers:"200–499 units · 30% discount",
  active:true
 },
 {
  id:3,
  name:"Enterprise Pricing",
  group:"Enterprise",
  moq:500,
  products:"Selected products",
  tiers:"500+ units · 40% discount",
  active:true
 },
 {
  id:4,
  name:"VIP Distributor",
  group:"VIP Distributor",
  moq:25,
  products:"Selected collections",
  tiers:"25+ units · 20% discount",
  active:false
 }
];

let rules=
 JSON.parse(localStorage.getItem("b2b_rules"))
 || defaultRules;

function saveData(){
 localStorage.setItem(
  "b2b_rules",
  JSON.stringify(rules)
 );
}

function renderRules(){

 const box=document.getElementById("rules");

 const query=
  document.getElementById("search").value
  .toLowerCase();

 let list=rules.filter(r=>{

  const matchesSearch=
   r.name.toLowerCase().includes(query)
   ||
   r.group.toLowerCase().includes(query);

  const matchesFilter=
   filter==="all"
   ||
   filter==="active" && r.active
   ||
   filter==="paused" && !r.active;

  return matchesSearch && matchesFilter;
 });

 if(!list.length){

  box.innerHTML=`
   <div class="empty">
    <div class="empty-icon">◇</div>
    <strong>No pricing rules found</strong>
    <div style="margin-top:6px">
     Create a rule or change your filters.
    </div>
   </div>
  `;

  return;
 }

 box.innerHTML=list.map(r=>`

  <div class="rule-row">

   <div class="rule-main">

    <div class="rule-title">
     ${escapeHTML(r.name)}
    </div>

    <div class="rule-meta">

     <span class="meta">
      ${escapeHTML(r.group)}
     </span>

     <span class="meta">
      MOQ ${r.moq || 0}
     </span>

     <span class="meta">
      ${escapeHTML(r.products)}
     </span>

     <span class="meta">
      ${escapeHTML(r.tiers)}
     </span>

    </div>

   </div>

   <span class="status ${r.active?'active':'paused'}">
    ${r.active?'Active':'Paused'}
   </span>

   <div class="rule-actions">

    <button
     class="small-btn"
     title="${r.active?'Pause':'Activate'}"
     onclick="toggleRule(${r.id})">
     ${r.active?'Ⅱ':'▶'}
    </button>

    <button
     class="small-btn"
     title="Duplicate"
     onclick="duplicateRule(${r.id})">
     ⧉
    </button>

    <button
     class="small-btn"
     title="Edit"
     onclick="editRule(${r.id})">
     ✎
    </button>

    <button
     class="small-btn"
     title="Delete"
     onclick="deleteRule(${r.id})">
     ×
    </button>

   </div>

  </div>

 `).join("");
}

function setFilter(value,button){

 filter=value;

 document
  .querySelectorAll(".filter")
  .forEach(x=>x.classList.remove("active"));

 button.classList.add("active");

 renderRules();
}

function openCreate(){

 editingId=null;

 document.getElementById("modalTitle")
  .textContent="Create pricing rule";

 document.getElementById("name").value="";
 document.getElementById("moq").value="";
 document.getElementById("group").value="Wholesale";
 document.getElementById("type").value="Percentage";
 document.getElementById("products").value="All products";

 document.getElementById("overlay")
  .style.display="flex";
}

function closeModal(){

 document.getElementById("overlay")
  .style.display="none";

}

function saveRule(){

 const name=
  document.getElementById("name")
  .value.trim();

 if(!name){
  alert("Enter a rule name.");
  return;
 }

 const group=
  document.getElementById("group").value;

 const moq=
  Number(document.getElementById("moq").value)||0;

 const products=
  document.getElementById("products").value;

 const rule={
  id:editingId || Date.now(),
  name,
  group,
  moq,
  products,
  tiers:"Custom quantity pricing",
  active:true
 };

 if(editingId){

  rules=rules.map(r=>
   r.id===editingId
    ? {...r,...rule}
    : r
  );

 }else{

  rules.unshift(rule);

 }

 saveData();
 renderRules();
 closeModal();

}

function editRule(id){

 const r=
  rules.find(x=>x.id===id);

 if(!r)return;

 editingId=id;

 document.getElementById("modalTitle")
  .textContent="Edit pricing rule";

 document.getElementById("name").value=r.name;
 document.getElementById("group").value=r.group;
 document.getElementById("moq").value=r.moq;
 document.getElementById("products").value=r.products;

 document.getElementById("overlay")
  .style.display="flex";
}

function duplicateRule(id){

 const original=
  rules.find(x=>x.id===id);

 if(!original)return;

 const copy={
  ...original,
  id:Date.now(),
  name:original.name+" Copy",
  active:false
 };

 rules.unshift(copy);

 saveData();
 renderRules();

}

function toggleRule(id){

 rules=rules.map(r=>
  r.id===id
   ? {...r,active:!r.active}
   : r
 );

 saveData();
 renderRules();

}

function deleteRule(id){

 const r=
  rules.find(x=>x.id===id);

 if(!r)return;

 if(!confirm(
  `Delete "${r.name}"?`
 ))return;

 rules=
  rules.filter(x=>x.id!==id);

 saveData();
 renderRules();

}

function addTier(){

 const tier=document.createElement("div");

 tier.className="tier";

 tier.innerHTML=`
  <input placeholder="500">
  <input placeholder="∞">
  <input placeholder="40%">
 `;

 document
  .getElementById("tiers")
  .appendChild(tier);

}

function toggleTheme(){

 const html=document.documentElement;

 if(
  html.getAttribute("data-theme")==="dark"
 ){

  html.removeAttribute("data-theme");

  localStorage.setItem(
   "theme",
   "light"
  );

  document.getElementById("theme")
   .textContent="☾";

 }else{

  html.setAttribute(
   "data-theme",
   "dark"
  );

  localStorage.setItem(
   "theme",
   "dark"
  );

  document.getElementById("theme")
   .textContent="☀";

 }

}

function escapeHTML(str){

 return String(str)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

function dashboard(){

 location.reload();

}

if(localStorage.getItem("theme")==="dark"){

 document.documentElement
