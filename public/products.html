<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pricing Rules — B2B Wholesale Pricing Fast</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#f6f6f7;
--card:#fff;
--text:#202223;
--muted:#6d7175;
--border:#e1e3e5;
--green:#008060;
--green-soft:#e7f5ef;
--red:#d72c0d;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,select{
font:inherit;
}

.header{
height:64px;
background:white;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 24px;
position:sticky;
top:0;
z-index:20;
}

.brand{
display:flex;
align-items:center;
gap:10px;
font-weight:700;
}

.logo{
width:34px;
height:34px;
border-radius:9px;
background:var(--green);
color:white;
display:grid;
place-items:center;
font-weight:800;
}

.header-right{
display:flex;
gap:8px;
}

.header-btn{
border:1px solid var(--border);
background:white;
padding:8px 13px;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.header-btn:hover{
background:#f1f2f3;
}

.page{
max-width:1120px;
margin:auto;
padding:30px 20px 60px;
}

.page-top{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:15px;
margin-bottom:25px;
}

h1{
margin:0 0 6px;
font-size:28px;
}

.subtitle{
color:var(--muted);
font-size:14px;
}

.primary{
background:var(--green);
color:white;
border:0;
border-radius:8px;
padding:10px 16px;
font-weight:650;
cursor:pointer;
}

.primary:hover{
background:#006e52;
}

.toolbar{
background:white;
border:1px solid var(--border);
border-radius:10px;
padding:12px;
display:flex;
gap:10px;
margin-bottom:18px;
}

.search{
flex:1;
border:1px solid #c9cccf;
border-radius:7px;
padding:10px 12px;
outline:none;
}

.search:focus{
border-color:var(--green);
box-shadow:0 0 0 2px var(--green-soft);
}

.filter{
border:1px solid #c9cccf;
background:white;
border-radius:7px;
padding:10px 12px;
}

.rules{
display:grid;
gap:12px;
}

.rule{
background:white;
border:1px solid var(--border);
border-radius:11px;
padding:18px;
}

.rule-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:15px;
}

.rule-name{
font-size:17px;
font-weight:700;
margin-bottom:5px;
}

.meta{
font-size:13px;
color:var(--muted);
}

.badge{
display:inline-flex;
align-items:center;
padding:4px 8px;
border-radius:20px;
font-size:12px;
font-weight:700;
margin-left:7px;
}

.active{
background:var(--green-soft);
color:#006e52;
}

.paused{
background:#f1f2f3;
color:#6d7175;
}

.tiers{
display:flex;
gap:8px;
flex-wrap:wrap;
margin:17px 0;
}

.tier{
border:1px solid var(--border);
border-radius:8px;
padding:10px 13px;
min-width:130px;
}

.tier small{
display:block;
color:var(--muted);
font-size:11px;
margin-bottom:4px;
}

.tier strong{
font-size:16px;
}

.actions{
display:flex;
gap:7px;
border-top:1px solid var(--border);
padding-top:13px;
}

.action{
border:1px solid var(--border);
background:white;
border-radius:7px;
padding:7px 11px;
cursor:pointer;
font-size:13px;
font-weight:600;
}

.action:hover{
background:#f6f6f7;
}

.action.danger{
color:var(--red);
}

.empty{
background:white;
border:1px dashed #c9cccf;
border-radius:11px;
padding:50px 20px;
text-align:center;
}

.empty h2{
margin:0 0 7px;
}

.empty p{
color:var(--muted);
margin:0 0 18px;
font-size:14px;
}

.modal-bg{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.42);
align-items:center;
justify-content:center;
padding:15px;
z-index:100;
}

.modal{
background:white;
width:100%;
max-width:570px;
max-height:90vh;
overflow:auto;
border-radius:12px;
padding:22px;
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.modal-head h2{
margin:0;
font-size:20px;
}

.close{
border:0;
background:transparent;
font-size:22px;
cursor:pointer;
}

.field{
margin-bottom:15px;
}

.field label{
display:block;
font-size:13px;
font-weight:650;
margin-bottom:6px;
}

.field input,
.field select{
width:100%;
border:1px solid #c9cccf;
border-radius:7px;
padding:10px;
}

.tier-row{
display:grid;
grid-template-columns:1fr 1fr 1fr auto;
gap:7px;
margin-bottom:8px;
}

.tier-row input{
min-width:0;
border:1px solid #c9cccf;
border-radius:7px;
padding:9px;
}

.remove-tier{
border:0;
background:#fff0ee;
color:var(--red);
border-radius:7px;
padding:0 10px;
cursor:pointer;
}

.add-tier{
border:1px dashed #aeb4b0;
background:white;
width:100%;
padding:9px;
border-radius:7px;
cursor:pointer;
}

.modal-actions{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:20px;
}

.secondary{
border:1px solid var(--border);
background:white;
padding:9px 14px;
border-radius:7px;
cursor:pointer;
font-weight:600;
}

@media(max-width:700px){

.header{
padding:0 13px;
}

.header-right .header-btn:nth-child(2){
display:none;
}

.page-top{
flex-direction:column;
}

.primary{
width:100%;
}

.toolbar{
flex-direction:column;
}

.rule-top{
flex-direction:column;
}

.actions{
flex-wrap:wrap;
}

.tier-row{
grid-template-columns:1fr 1fr;
}

}
</style>
</head>

<body>

<header class="header">

<div class="brand">
<div class="logo">B</div>
<span>B2B Wholesale Pricing Fast</span>
</div>

<div class="header-right">
<button class="header-btn" onclick="location.href='/'">Dashboard</button>
<button class="header-btn" onclick="location.href='/help.html'">Help</button>
</div>

</header>

<main class="page">

<div class="page-top">
<div>
<h1>Pricing Rules</h1>
<div class="subtitle">
Create and manage quantity-based wholesale pricing.
</div>
</div>

<button class="primary" onclick="openCreate()">
＋ Create pricing rule
</button>
</div>

<div class="toolbar">

<input
id="search"
class="search"
placeholder="Search pricing rules..."
oninput="render()"
>

<select id="statusFilter" class="filter" onchange="render()">
<option value="all">All rules</option>
<option value="active">Active</option>
<option value="paused">Paused</option>
</select>

</div>

<div id="rules" class="rules"></div>

</main>


<div id="modalBg" class="modal-bg">

<div class="modal">

<div class="modal-head">
<h2 id="modalTitle">Create pricing rule</h2>
<button class="close" onclick="closeModal()">×</button>
</div>

<div class="field">
<label>Rule name</label>
<input id="ruleName" placeholder="Example: Wholesale Tier 1">
</div>

<div class="field">
<label>Customer group</label>
<select id="ruleGroup">
<option>Wholesale</option>
<option>Enterprise</option>
<option>VIP</option>
</select>
</div>

<div class="field">
<label>Products</label>
<select id="ruleProducts">
<option>All products</option>
<option>Selected products</option>
</select>
</div>

<div class="field">
<label>Pricing tiers</label>
<div id="tiers"></div>
<button class="add-tier" onclick="addTier()">＋ Add pricing tier</button>
</div>

<div class="modal-actions">
<button class="secondary" onclick="closeModal()">Cancel</button>
<button class="primary" onclick="saveRule()">Save rule</button>
</div>

</div>
</div>


<script>

let rules=[];
let editingId=null;

function loadRules(){

try{

rules=JSON.parse(
localStorage.getItem("b2b_rules")
);

}catch(e){

rules=[];

}

if(!Array.isArray(rules)){
rules=[];
}

}

function saveRules(){

localStorage.setItem(
"b2b_rules",
JSON.stringify(rules)
);

}

function render(){

const container=document.getElementById("rules");

const query=document
.getElementById("search")
.value
.toLowerCase();

const status=document
.getElementById("statusFilter")
.value;

const data=rules.filter(function(rule){

const matchesSearch=
String(rule.name||"")
.toLowerCase()
.includes(query);

const matchesStatus=
status==="all" ||
(status==="active" && rule.active) ||
(status==="paused" && !rule.active);

return matchesSearch && matchesStatus;

});

if(!data.length){

container.innerHTML=`
<div class="empty">
<h2>No pricing rules found</h2>
<p>Create your first wholesale pricing rule to get started.</p>
<button class="primary" onclick="openCreate()">
＋ Create pricing rule
</button>
</div>
`;

return;

}

container.innerHTML=data.map(function(rule){

const tiers=Array.isArray(rule.tiers)
?rule.tiers
:[];

return `
<div class="rule">

<div class="rule-top">

<div>
<div class="rule-name">
${escapeHTML(rule.name||"Untitled rule")}
<span class="badge ${rule.active!==false?"active":"paused"}">
${rule.active!==false?"Active":"Paused"}
</span>
</div>

<div class="meta">
${escapeHTML(rule.group||"Wholesale")}
&nbsp; • &nbsp;
${escapeHTML(rule.products||"All products")}
</div>
</div>

<div class="meta">
MOQ: ${escapeHTML(rule.moq||"-")}
</div>

</div>

<div class="tiers">

${
tiers.length
?tiers.map(function(t){

return `
<div class="tier">
<small>Quantity</small>
<strong>
${escapeHTML(t.min)}–${escapeHTML(t.max)}
</strong>
<div class="meta">
${escapeHTML(t.discount)}
</div>
</div>
`;

}).join("")
:"<div class='meta'>No pricing tiers configured.</div>"
}

</div>

<div class="actions">

<button class="action"
onclick="editRule(${rule.id})">
Edit
</button>

<button class="action"
onclick="duplicateRule(${rule.id})">
Duplicate
</button>

<button class="action"
onclick="toggleRule(${rule.id})">
${rule.active!==false?"Pause":"Activate"}
</button>

<button class="action danger"
onclick="deleteRule(${rule.id})">
Delete
</button>

</div>

</div>
`;

}).join("");

}

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function openCreate(){

editingId=null;

document.getElementById("modalTitle")
.textContent="Create pricing rule";

document.getElementById("ruleName").value="";
document.getElementById("ruleGroup").value="Wholesale";
document.getElementById("ruleProducts").value="All products";

document.getElementById("tiers").innerHTML="";

addTier();

document.getElementById("modalBg")
.style.display="flex";

}

function closeModal(){

document.getElementById("modalBg")
.style.display="none";

}

function addTier(data){

const container=document.getElementById("tiers");

const row=document.createElement("div");

row.className="tier-row";

row.innerHTML=`

<input
class="tier-min"
type="number"
min="1"
placeholder="Min"
value="${data?.min||""}"
>

<input
class="tier-max"
placeholder="Max"
value="${data?.max||""}"
>

<input
class="tier-discount"
placeholder="Discount e.g. 15%"
value="${data?.discount||""}"
>

<button
class="remove-tier"
onclick="this.parentElement.remove()">
×
</button>

`;

container.appendChild(row);

}

function getTiers(){

return Array.from(
document.querySelectorAll("#tiers .tier-row")
).map(function(row){

return {
min:row.querySelector(".tier-min").value,
max:row.querySelector(".tier-max").value||"∞",
discount:row.querySelector(".tier-discount").value
};

}).filter(function(t){

return t.min && t.discount;

});

}

function saveRule(){

const name=document
.getElementById("ruleName")
.value.trim();

if(!name){

alert("Please enter a rule name.");
return;

}

const tiers=getTiers();

if(!tiers.length){

alert("Add at least one pricing tier.");
return;

}

const obj={

id:editingId || Date.now(),

name:name,

group:document
.getElementById("ruleGroup")
.value,

products:document
.getElementById("ruleProducts")
.value,

moq:Number(tiers[0].min),

active:true,

tiers:tiers

};

if(editingId){

const index=rules.findIndex(
r=>r.id===editingId
);

if(index!==-1){

obj.active=rules[index].active;
rules[index]=obj;

}

}else{

rules.push(obj);

}

saveRules();
render();
closeModal();

}

function editRule(id){

const rule=rules.find(
r=>r.id===id
);

if(!rule)return;

editingId=id;

document.getElementById("modalTitle")
.textContent="Edit pricing rule";

document.getElementById("ruleName")
.value=rule.name||"";

document.getElementById("ruleGroup")
.value=rule.group||"Wholesale";

document.getElementById("ruleProducts")
.value=rule.products||"All products";

document.getElementById("tiers").innerHTML="";

(rule.tiers||[]).forEach(addTier);

document.getElementById("modalBg")
.style.display="flex";

}

function duplicateRule(id){

const rule=rules.find(
r=>r.id===id
);

if(!rule)return;

const copy=JSON.parse(
JSON.stringify(rule)
);

copy.id=Date.now();

copy.name=rule.name+" Copy";

rules.push(copy);

saveRules();
render();

}

function toggleRule(id){

const rule=rules.find(
r=>r.id===id
);

if(!rule)return;

rule.active=rule.active===false;

saveRules();
render();

}

function deleteRule(id){

const rule=rules.find(
r=>r.id===id
);

if(!rule)return;

if(!confirm(
'Delete "'+rule.name+'"?'
))return;

rules=rules.filter(
r=>r.id!==id
);

saveRules();
render();

}

loadRules();
render();

</script>

</body>
</html>
