<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account — B2B Wholesale Pricing Fast</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#f6f6f7;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
color:#202223;
}

.card{
width:100%;
max-width:430px;
background:white;
border:1px solid #e1e3e5;
border-radius:14px;
padding:32px;
margin:20px;
box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.logo{
width:44px;
height:44px;
border-radius:11px;
background:#008060;
color:white;
display:grid;
place-items:center;
font-weight:800;
font-size:20px;
margin-bottom:20px;
}

h1{
margin:0 0 7px;
font-size:25px;
}

.sub{
color:#6d7175;
font-size:14px;
margin-bottom:25px;
}

label{
display:block;
font-size:13px;
font-weight:650;
margin:15px 0 6px;
}

input{
width:100%;
padding:11px 12px;
border:1px solid #c9cccf;
border-radius:8px;
font-size:15px;
outline:none;
}

input:focus{
border-color:#008060;
box-shadow:0 0 0 2px #e7f5ef;
}

button{
width:100%;
margin-top:20px;
padding:11px;
border:0;
border-radius:8px;
background:#008060;
color:white;
font-weight:700;
cursor:pointer;
}

button:hover{
background:#006e52;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

#message{
display:none;
margin-top:15px;
padding:11px;
border-radius:8px;
font-size:13px;
background:#fff0ee;
color:#d72c0d;
}

.footer{
margin-top:20px;
text-align:center;
font-size:13px;
color:#6d7175;
line-height:1.7;
}

.footer a{
color:#008060;
text-decoration:none;
font-weight:600;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">B</div>

<h1>Create your account</h1>

<div class="sub">
Start managing wholesale pricing for your Shopify store.
</div>

<form id="registerForm">

<label>Name</label>

<input
id="name"
type="text"
placeholder="Your name"
required
autocomplete="name"
>

<label>Email</label>

<input
id="email"
type="email"
placeholder="you@example.com"
required
autocomplete="email"
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="At least 8 characters"
required
minlength="8"
autocomplete="new-password"
>

<label>Confirm password</label>

<input
id="confirmPassword"
type="password"
placeholder="Repeat your password"
required
minlength="8"
autocomplete="new-password"
>

<button id="submitBtn" type="submit">
Create account
</button>

</form>

<div id="message"></div>

<div class="footer">

Already have an account?
<a href="/login.html">Sign in</a>

<br>

<a href="/">Back to app</a>

</div>

</div>

<script>

const form=document.getElementById("registerForm");
const message=document.getElementById("message");
const button=document.getElementById("submitBtn");

function showMessage(text){

message.textContent=text;
message.style.display="block";

}

form.addEventListener("submit",async function(e){

e.preventDefault();

const password=
document.getElementById("password").value;

const confirm=
document.getElementById("confirmPassword").value;

if(password!==confirm){

showMessage("Passwords do not match.");
return;

}

if(password.length<8){

showMessage("Password must be at least 8 characters.");
return;

}

button.disabled=true;
button.textContent="Creating account...";
message.style.display="none";

try{

const response=await fetch("/api/auth/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:
document.getElementById("name").value.trim(),

email:
document.getElementById("email").value.trim(),

password:password

})

});

const data=await response.json();

if(!response.ok || !data.success){

throw new Error(
data.message ||
data.error ||
"Unable to create account."
);

}

if(data.token){

localStorage.setItem(
"b2b_session_token",
data.token
);

window.location.href="/";

return;

}

window.location.href="/login.html";

}catch(error){

showMessage(error.message);

button.disabled=false;
button.textContent="Create account";

}

});

</script>

</body>
</html>
