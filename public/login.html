<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — B2B Wholesale Pricing Fast</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#f6f6f7;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
color:#202223;
}

.card{
width:100%;
max-width:420px;
background:white;
border:1px solid #e1e3e5;
border-radius:14px;
padding:32px;
margin:20px;
box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.logo{
width:44px;
height:44px;
border-radius:11px;
background:#008060;
color:white;
display:grid;
place-items:center;
font-weight:800;
font-size:20px;
margin-bottom:20px;
}

h1{
margin:0 0 7px;
font-size:25px;
}

.sub{
color:#6d7175;
font-size:14px;
margin-bottom:25px;
}

label{
display:block;
font-size:13px;
font-weight:650;
margin:15px 0 6px;
}

input{
width:100%;
padding:11px 12px;
border:1px solid #c9cccf;
border-radius:8px;
font-size:15px;
outline:none;
}

input:focus{
border-color:#008060;
box-shadow:0 0 0 2px #e7f5ef;
}

button{
width:100%;
margin-top:20px;
padding:11px;
border:0;
border-radius:8px;
background:#008060;
color:white;
font-weight:700;
cursor:pointer;
}

button:hover{
background:#006e52;
}

#message{
display:none;
margin-top:15px;
padding:11px;
border-radius:8px;
font-size:13px;
background:#fff0ee;
color:#d72c0d;
}

.footer{
margin-top:20px;
text-align:center;
font-size:12px;
color:#6d7175;
}

.footer a{
color:#008060;
text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">B</div>

<h1>Welcome back</h1>

<div class="sub">
Sign in to B2B Wholesale Pricing Fast.
</div>

<form id="loginForm">

<label>Email</label>
<input
id="email"
type="email"
placeholder="you@example.com"
required
autocomplete="email"
>

<label>Password</label>
<input
id="password"
type="password"
placeholder="Your password"
required
autocomplete="current-password"
>

<button id="submitBtn" type="submit">
Sign in
</button>

</form>

<div id="message"></div>

<div class="footer">
B2B Wholesale Pricing Fast
<br>
<a href="/">Back to app</a>
</div>

</div>

<script>

const form=document.getElementById("loginForm");
const message=document.getElementById("message");
const button=document.getElementById("submitBtn");

function showMessage(text){
message.textContent=text;
message.style.display="block";
}

form.addEventListener("submit",async function(e){

e.preventDefault();

message.style.display="none";
button.disabled=true;
button.textContent="Signing in...";

try{

const response=await fetch("/api/auth/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:document.getElementById("email").value.trim(),
password:document.getElementById("password").value
})
});

const data=await response.json();

if(!response.ok || !data.success){

throw new Error(
data.message ||
data.error ||
"Invalid email or password."
);

}

if(data.token){

localStorage.setItem(
"b2b_session_token",
data.token
);

}

window.location.href="/";

}catch(error){

showMessage(error.message);

button.disabled=false;
button.textContent="Sign in";

}

});

</script>

</body>
</html>
