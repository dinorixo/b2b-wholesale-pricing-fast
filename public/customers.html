<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B2B Wholesale Pricing Fast — Customer Groups</title>

<style>
:root{
--bg:#f6f7f8;--card:#fff;--text:#202223;--muted:#6d7175;
--border:#e1e3e5;--primary:#008060;--soft:#e7f5ef;--danger:#d72c0d;
}
[data-theme="dark"]{
--bg:#101312;--card:#181c1a;--text:#f1f3f2;--muted:#a6ada9;
--border:#303633;--primary:#35b98a;--soft:#17382d;--danger:#ff6b52;
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--text);
font-family:Arial,sans-serif
}
button,input,select{font:inherit}

.header{
height:64px;background:var(--card);
border-bottom:1px solid var(--border);
display:flex;align-items:center;justify-content:space-between;
padding:0 18px;position:sticky;top:0;z-index:20
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.logo{
width:36px;height:36px;border-radius:9px;
background:var(--primary);color:white;
display:grid;place-items:center;font-weight:800
}
.brand span{color:var(--primary)}
.right{display:flex;align-items:center;gap:7px}
.icon{
width:38px;height:38px;border:0;background:transparent;
color:var(--text);border-radius:8px;cursor:pointer
}
.store{
border:1px solid var(--border);background:var(--card);
color:var(--text);border-radius:9px;
padding:4px 7px 4px 12px;display:flex;
align-items:center;gap:8px
}
.avatar{
width:30px;height:30px;border-radius:8px;
background:var(--primary);color:#fff;
display:grid;place-items:center;font-weight:bold
}

.sidebar{
width:230px;position:fixed;top:64px;bottom:0;
background:var(--card);border-right:1px solid var(--border);
padding:18px 12px
}
.label{
font-size:10px;font-weight:bold;letter-spacing:1px;
color:var(--muted);padding:12px 10px 7px
}
.nav{
width:100%;border:0;background:transparent;color:var(--muted);
text-align:left;padding:10px;border-radius:8px;
cursor:pointer;margin-bottom:3px
}
.nav.active{
background:var(--soft);color:var(--primary);font-weight:bold
}

.main{margin-left:230px;padding:28px}
.container{max-width:1100px;margin:auto}

.top{
display:flex;justify-content:space-between;
align-items:end;gap:15px;margin-bottom:24px
}
.eyebrow{
font-size:10px;font-weight:bold;letter-spacing:1px;
color:var(--primary);margin-bottom:7px
}
h1{margin:0;font-size:28px}
.subtitle{
margin-top:7px;font-size:13px;color:var(--muted)
}

.btn{
border:1px solid var(--border);background:var(--card);
color:var(--text);padding:10px 14px;
border-radius:8px;font-weight:bold;cursor:pointer
}
.primary{
background:var(--primary);
border-color:var(--primary);color:white
}

.panel{
background:var(--card);
border:1px solid var(--border);
border-radius:11px;overflow:hidden
}

.toolbar{
padding:14px 16px;
border-bottom:1px solid var(--border);
display:flex;gap:10px;align-items:center
}

.search{
flex:1;position:relative
}
.search input{
width:100%;padding:10px 12px;
border:1px solid var(--border);
border-radius:8px;background:var(--card);
color:var(--text);outline:none
}

.table-wrap{overflow-x:auto}
table{
width:100%;border-collapse:collapse;
min-width:650px
}
th{
text-align:left;font-size:10px;
color:var(--muted);letter-spacing:.5px;
padding:12px 16px;
border-bottom:1px solid var(--border)
}
td{
padding:15px 16px;
border-bottom:1px solid var(--border);
font-size:12px
}
tr:last-child td{border-bottom:0}

.group{
display:flex;align-items:center;gap:10px
}
.group-icon{
width:36px;height:36px;border-radius:9px;
background:var(--soft);color:var(--primary);
display:grid;place-items:center;font-weight:bold
}
.group-name{font-weight:bold}
.group-desc{
font-size:10px;color:var(--muted);
margin-top:3px
}

.badge{
display:inline-block;
padding:5px 8px;border-radius:20px;
background:var(--soft);color:var(--primary);
font-size:10px;font-weight:bold
}
.count{font-weight:bold}

.actions{display:flex;gap:6px}
.small{
border:1px solid var(--border);
background:var(--card);color:var(--text);
padding:7px 9px;border-radius:7px;
cursor:pointer;font-size:11px
}
.danger{color:var(--danger)}

.modal-bg{
display:none;position:fixed;inset:0;
background:rgba(0,0,0,.45);
z-index:100;padding:20px
}
.modal{
max-width:500px;margin:70px auto;
background:var(--card);border-radius:12px;
border:1px solid var(--border);
box-shadow:0 20px 50px rgba(0,0,0,.2)
}
.modal-head{
padding:18px;border-bottom:1px solid var(--border);
display:flex;justify-content:space-between
}
.modal-body{padding:18px}
.modal-foot{
padding:14px 18px;border-top:1px solid var(--border);
display:flex;justify-content:flex-end;gap:8px
}
.field{margin-bottom:15px}
.field label{
display:block;font-size:10px;
font-weight:bold;color:var(--muted);
margin-bottom:7px
}
.field input,.field select{
width:100%;padding:11px;
border:1px solid var(--border);
border-radius:7px;background:var(--card);
color:var(--text);outline:none
}
.close{
border:0;background:transparent;
color:var(--muted);font-size:20px;cursor:pointer
}

.empty{
padding:45px;text-align:center;
color:var(--muted);font-size:12px
}

.mobile{display:none}

@media(max-width:800px){
.sidebar{display:none}
.main{margin-left:0;padding:20px 14px 85px}
.top{display:block}
.top .btn{width:100%;margin-top:15px}
.toolbar{flex-direction:column;align-items:stretch}
.search{width:100%}
}
@media(max-width:480px){
.brand{font-size:12px}
.store span{display:none}
}
</style>
</head>

<body>

<header class="header">

<div class="brand">
<div class="logo">BF</div>
<div>B2B Wholesale Pricing <span>Fast</span></div>
</div>

<div class="right">
<button class="icon" id="theme" onclick="toggleTheme()">☾</button>
<button class="icon">🔔</button>

<div class="store">
<span>My Store</span>
<div class="avatar">M</div>
</div>
</div>

</header>


<aside class="sidebar">

<div class="label">OVERVIEW</div>

<button class="nav" onclick="location.href='index.html'">
⌂ &nbsp; Dashboard
</button>

<div class="label">COMMERCE</div>

<button class="nav" onclick="location.href='rules.html'">
◇ &nbsp; Pricing Rules
</button>

<button class="nav active">
♙ &nbsp; Customer Groups
</button>

<button class="nav" onclick="location.href='products.html'">
▣ &nbsp; Products
</button>

<button class="nav" onclick="location.href='pricelists.html'">
▤ &nbsp; Price Lists
</button>

<button class="nav" onclick="location.href='moq.html'">
⊙ &nbsp; MOQ & Checkout
</button>

<div class="label">INSIGHTS</div>

<button class="nav">
◒ &nbsp; Analytics
</button>

<div class="label">SYSTEM</div>

<button class="nav">
⚙ &nbsp; Settings
</button>

</aside>


<main class="main">

<div class="container">

<div class="top">

<div>

<div class="eyebrow">B2B ACCESS</div>

<h1>Customer Groups</h1>

<div class="subtitle">
Organize wholesale buyers into pricing and access tiers.
</div>

</div>

<button class="btn primary" onclick="openModal()">
+ Create group
</button>

</div>


<div class="panel">

<div class="toolbar">

<div class="search">
<input
id="search"
placeholder="Search customer groups..."
oninput="render()">
</div>

</div>


<div class="table-wrap">

<table>

<thead>
<tr>
<th>GROUP</th>
<th>CUSTOMER TAG</th>
<th>CUSTOMERS</th>
<th>PRICING</th>
<th>STATUS</th>
<th></th>
</tr>
</thead>

<tbody id="groups"></tbody>

</table>

</div>

</div>

</div>

</main>


<div class="modal-bg" id="modal">

<div class="modal">

<div class="modal-head">

<strong>Create customer group</strong>

<button class="close" onclick="closeModal()">×</button>

</div>

<div class="modal-body">

<div class="field">

<label>GROUP NAME</label>

<input id="groupName" placeholder="Example: VIP Distributor">

</div>

<div class="field">

<label>SHOPIFY CUSTOMER TAG</label>

<input id="groupTag" placeholder="Example: wholesale_vip">

</div>

<div class="field">

<label>PRICING LEVEL</label>

<select id="pricing">
<option>Wholesale</option>
<option>VIP Wholesale</option>
<option>Enterprise</option>
</select>

</div>

</div>

<div class="modal-foot">

<button class="btn" onclick="closeModal()">Cancel</button>

<button class="btn primary" onclick="createGroup()">
Create group
</button>

</div>

</div>

</div>


<nav class="mobile">

<button onclick="location.href='index.html'">
⌂<br>Home
</button>

<button onclick="location.href='rules.html'">
◇<br>Pricing
</button>

<button class="active">
♙<br>Customers
</button>

<button onclick="location.href='products.html'">
▣<br>Products
</button>

<button>
⚙<br>Settings
</button>

</nav>


<script>

const defaultGroups=[
{
id:1,
name:"Wholesale",
tag:"wholesale",
customers:0,
pricing:"Wholesale",
active:true
},
{
id:2,
name:"VIP Distributor",
tag:"wholesale_vip",
customers:0,
pricing:"VIP Wholesale",
active:true
},
{
id:3,
name:"Enterprise",
tag:"enterprise",
customers:0,
pricing:"Enterprise",
active:true
}
];

let groups=JSON.parse(
localStorage.getItem("b2b_customer_groups")
||JSON.stringify(defaultGroups)
);


function render(){

const query=
document.getElementById("search")
.value.toLowerCase();

const filtered=groups.filter(g=>
g.name.toLowerCase().includes(query) ||
g.tag.toLowerCase().includes(query)
);

const tbody=document.getElementById("groups");

if(!filtered.length){

tbody.innerHTML=`
<tr>
<td colspan="6">
<div class="empty">
No customer groups found.
</div>
</td>
</tr>`;

return;
}

tbody.innerHTML=filtered.map(g=>`

<tr>

<td>

<div class="group">

<div class="group-icon">
${escapeText(g.name.charAt(0).toUpperCase())}
</div>

<div>

<div class="group-name">
${escapeText(g.name)}
</div>

<div class="group-desc">
B2B pricing group
</div>

</div>

</div>

</td>

<td>
<code>${escapeText(g.tag)}</code>
</td>

<td class="count">
${g.customers}
</td>

<td>
${escapeText(g.pricing)}
</td>

<td>

<span class="badge">
${g.active?"Active":"Paused"}
</span>

</td>

<td>

<div class="actions">

<button class="small"
onclick="toggleGroup(${g.id})">
${g.active?"Pause":"Enable"}
</button>

<button class="small danger"
onclick="deleteGroup(${g.id})">
Delete
</button>

</div>

</td>

</tr>

`).join("");

}


function openModal(){

document.getElementById("modal").style.display="block";

document.getElementById("groupName").focus();

}


function closeModal(){

document.getElementById("modal").style.display="none";

}


function createGroup(){

const name=
document.getElementById("groupName").value.trim();

const tag=
document.getElementById("groupTag").value.trim();

const pricing=
document.getElementById("pricing").value;

if(!name || !tag){

alert("Enter a group name and customer tag.");

return;

}

groups.push({
id:Date.now(),
name:name,
tag:tag,
customers:0,
pricing:pricing,
active:true
});

save();

document.getElementById("groupName").value="";
document.getElementById("groupTag").value="";

closeModal();

render();

}


function toggleGroup(id){

const group=groups.find(g=>g.id===id);

if(!group)return;

group.active=!group.active;

save();
render();

}


function deleteGroup(id){

if(!confirm("Delete this customer group?"))return;

groups=groups.filter(g=>g.id!==id);

save();
render();

}


function save(){

localStorage.setItem(
"b2b_customer_groups",
JSON.stringify(groups)
);

}


function escapeText(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function toggleTheme(){

const html=document.documentElement;

const dark=
html.getAttribute("data-theme")==="dark";

if(dark){

html.removeAttribute("data-theme");
localStorage.setItem("b2b_theme","light");

document.getElementById("theme").textContent="☾";

}else{

html.setAttribute("data-theme","dark");
localStorage.setItem("b2b_theme","dark");

document.getElementById("theme").textContent="☀";

}

}


if(localStorage.getItem("b2b_theme")==="dark"){

document.documentElement.setAttribute("data-theme","dark");
document.getElementById("theme").textContent="☀";

}


render();

</script>

</body>
</html>
